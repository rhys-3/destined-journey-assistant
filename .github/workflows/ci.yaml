name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the package version after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node tests/ui/test-ui.cjs
      - run: node tests/ui/test-assistant.cjs
      - run: node tests/ui/test-themes.cjs
      - run: node tests/ui/test-settings.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-bundle
          path: dist/destined-journey-assistant.js
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          include-hidden-files: true
          path: |
            dist/destined-journey-assistant.js
            .ui-review/*results.json
            .ui-review/*.png
  bundle:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: assistant-bundle
          path: dist
      - name: Commit verified bundle
        id: commit
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo 'Main changed during verification; refusing to publish a stale bundle. Rerun on current main.'
            exit 1
          fi
          git add -- dist/destined-journey-assistant.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: update verified assistant bundle'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release:
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bundle.outputs.commit }}
          fetch-depth: 0
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "Version already exists; refusing to overwrite $version"
            exit 1
          fi
          git tag "$version"
          git push origin "$version"
          gh release create "$version" dist/destined-journey-assistant.js --title "$version · 命定预设助手" --notes-file "docs/RELEASE-$version.md"
