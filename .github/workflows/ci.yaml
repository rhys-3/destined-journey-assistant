name: Build and version
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      build: ${{ steps.scope.outputs.build }}
      python: ${{ steps.scope.outputs.python }}
      ui: ${{ steps.scope.outputs.ui }}
      assistant: ${{ steps.scope.outputs.assistant }}
      themes: ${{ steps.scope.outputs.themes }}
      settings: ${{ steps.scope.outputs.settings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFICATION_WORKFLOW: ci.yaml
        run: node scripts/verify-changes.mjs --plan
  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-changes.mjs --docs
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.python == 'true' && runner.os == 'Linux'
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -p test_update_types.py
        if: needs.plan.outputs.python == 'true' && runner.os == 'Linux'
      - uses: pnpm/action-setup@v6
        if: needs.plan.outputs.build == 'true'
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        if: needs.plan.outputs.build == 'true'
      - run: pnpm test
        if: needs.plan.outputs.build == 'true'
      - run: pnpm build
        if: needs.plan.outputs.build == 'true'
      - run: node tests/ui/test-ui.cjs
        if: needs.plan.outputs.ui == 'true' && runner.os == 'Linux'
      - run: node tests/ui/test-assistant.cjs
        if: needs.plan.outputs.assistant == 'true' && runner.os == 'Linux'
      - run: node tests/ui/test-themes.cjs
        if: needs.plan.outputs.themes == 'true' && runner.os == 'Linux'
      - run: node tests/ui/test-settings.cjs
        if: needs.plan.outputs.settings == 'true' && runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.build == 'true' && runner.os == 'Linux'
        with:
          name: assistant-bundle
          path: dist/destined-journey-assistant.js
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.build == 'true' && runner.os == 'Linux'
        with:
          name: verification
          include-hidden-files: true
          path: |
            .ui-review/*results.json
            .ui-review/*.png
  bundle:
    needs: [plan, verify]
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: assistant-bundle
          path: dist
      - name: Commit verified bundle
        id: commit
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo 'Main changed during verification; refusing to publish a stale bundle. Rerun on current main.'
            exit 1
          fi
          git add -- dist/destined-journey-assistant.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: update verified assistant bundle'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  version:
    needs: bundle
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bundle.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create immutable version tag
        id: tag
        run: node scripts/publish-version.mjs
      - name: Verify new fixed CDN version
        if: steps.tag.outputs.check_cdn == 'true'
        run: node scripts/check-cdn.mjs
