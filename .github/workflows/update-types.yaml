name: Update Tavern Helper types
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-tavern-helper-types
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -p test_update_types.py
      - run: python scripts/update-types.py
      - name: Commit declaration updates only
        run: |
          git add -- @types/function @types/iframe
          if git diff --cached --quiet; then
            echo 'Tavern Helper declarations are already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Tavern Helper type declarations'
          git push origin HEAD:main
